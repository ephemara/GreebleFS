[package]
name = "greeble"
version = "0.1.0"
description = "OverlayTerm desktop command hub"
authors = ["you"]
edition = "2021"
default-run = "greeble"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greeble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "specta"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true }
specta-typescript = { workspace = true }
portable-pty = "0.9.0"
log = "0.4.29"
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2.3.5"
window-vibrancy = "0.6"
dirs = "6.0.0"
arboard = "3.6.1"
base64 = "0.22.1"
image = "0.25.8"
xcap = "0.9.1"
drag = "2.1.0"
file_icon_provider = "1.0.0"
notify = "8.2.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", features = ["time"] }
overlay-contracts = { path = "../crates/overlay-contracts" }
yazi-specta = { path = "../crates/yazi-specta" }
yazi-boot = { path = "../crates/fileexplorer/crates/yazi-boot" }
yazi-config = { path = "../crates/fileexplorer/crates/yazi-config" }
yazi-dds = { path = "../crates/fileexplorer/crates/yazi-dds" }
yazi-fs = { path = "../crates/fileexplorer/crates/yazi-fs" }
yazi-scheduler = { path = "../crates/fileexplorer/crates/yazi-scheduler" }
yazi-shared = { path = "../crates/fileexplorer/crates/yazi-shared" }
yazi-term = { path = "../crates/fileexplorer/crates/yazi-term" }
yazi-vfs = { path = "../crates/fileexplorer/crates/yazi-vfs" }

[dev-dependencies]
tokio  = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-windows = { path = "../crates/file-opening-windows" }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-macos = { path = "../crates/file-opening-macos" }
