[package]
name = "greeblefs"
version = "0.1.0"
description = "GreebleFS desktop workbench"
authors = ["you"]
edition = "2021"
default-run = "greeblefs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
native-shaderc = ["dep:shaderc"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greeble_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "specta", "protocol-asset", "test"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-kain = { path = "../../tauron/crates/tauri-plugin-kain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true }
specta-typescript = { workspace = true }
portable-pty = "0.9.0"
shadow-terminal = "0.2.3"
log = "0.4.29"
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2.3.5"
window-vibrancy = "0.6"
dirs = "6.0.0"
arboard = "3.6.1"
base64 = "0.22.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
image = "0.25.8"
imageproc = "0.25.0"
ab_glyph = "0.2.29"
fontdb = "0.16.2"
include_dir = "0.7.4"
libc = { workspace = true }
naga = { version = "29.0.1", features = ["spv-in", "wgsl-in", "wgsl-out"] }
pollster = "0.4.0"
lopdf = "0.32.0"
pdfium-auto = "0.3.0"
pdfium-render = "0.8.37"
pyo3 = { version = "0.21.2", features = ["auto-initialize"] }
tauri-plugin-screenshots = "2"
drag = "2.1.0"
file_icon_provider = "1.0.0"
ignore = "0.4.25"
notify = "8.2.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = "3.6.2"
rand = "0.8"
sha2 = "0.10"
md5 = "0.7"
regex = "1.11"
tar = "0.4.45"
flate2 = "1.1.5"
bzip2 = "0.6.1"
xz2 = "0.1.7"
zip = "8.5.1"
sevenz-rust = { version = "0.6.1", default-features = false }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-recursion = "1"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
mdns-sd = { version = "0.18", features = ["async"] }
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
local-ip-address = "0.6"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mime_guess = "2"
once_cell = "1.21"
shaderc = { version = "0.10.1", optional = true }
tantivy = "0.25"
p256 = "0.13"
toml = { workspace = true }
which = { workspace = true }
greeble-ipc-contracts = { path = "../crates/greeble-ipc-contracts" }
overlay-contracts = { path = "../crates/overlay-contracts" }
yazi-specta = { path = "../crates/yazi-specta" }
yazi-boot = { path = "../crates/fileexplorer/crates/yazi-boot" }
yazi-config = { path = "../crates/fileexplorer/crates/yazi-config" }
yazi-dds = { path = "../crates/fileexplorer/crates/yazi-dds" }
yazi-fs = { path = "../crates/fileexplorer/crates/yazi-fs" }
yazi-scheduler = { path = "../crates/fileexplorer/crates/yazi-scheduler" }
yazi-sftp = { path = "../crates/fileexplorer/crates/yazi-sftp" }
yazi-shared = { path = "../crates/fileexplorer/crates/yazi-shared" }
yazi-term = { path = "../crates/fileexplorer/crates/yazi-term" }
yazi-vfs = { path = "../crates/fileexplorer/crates/yazi-vfs" }
# Keep the russh / RustCrypto prerelease family exact. Cargo will otherwise
# float these prerelease ranges onto newer stable releases when Cargo.lock is
# absent, which breaks clean builds in the SSH/SFTP stack.
crypto-bigint = { version = "=0.7.0-rc.10", default-features = false, features = ["alloc", "zeroize"] }
crypto-primes = { version = "=0.7.0-pre.4", default-features = false }
der = { version = "=0.8.0-rc.9", default-features = false, features = ["oid"] }
pkcs1 = { version = "=0.8.0-rc.4", default-features = false, features = ["alloc", "pem"] }
pkcs8 = { version = "=0.11.0-rc.8", default-features = false, features = ["alloc", "pem"] }
rsa = { version = "=0.10.0-rc.10", default-features = false, features = ["sha2"] }
spki = { version = "=0.8.0-rc.4", default-features = false, features = ["alloc"] }
russh = { workspace = true }
arc-swap = "1.7.1"
cpal = "0.17.3"
rubato = "2.0.0"
rustfft = "6.4.1"
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }
rust_ffmpeg = { path = "../crates/ffmpeg-suite-rs/rust_ffmpeg" }
rust_ffprobe = { path = "../crates/ffmpeg-suite-rs/rust_ffprobe" }
wgpu = "26"
vst-host = { path = "../crates/vst-host" }

[dev-dependencies]
tokio  = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-windows = { path = "../crates/file-opening-windows" }
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.58"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-macos = { path = "../crates/file-opening-macos" }
sd-desktop-macos = { path = "../crates/macos" }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
libloading = "0.9.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# The web push stack still pulls OpenSSL through ece. Keep it off Windows for
# now so the MSVC build does not require a local OpenSSL toolchain.
web-push = "0.11"
