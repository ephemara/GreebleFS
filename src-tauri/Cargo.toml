[package]
name = "greeblefs"
version = "0.1.0"
description = "GreebleFS desktop workbench"
authors = ["you"]
edition = "2021"
default-run = "greeblefs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "greeble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "specta"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true }
specta-typescript = { workspace = true }
portable-pty = "0.9.0"
log = "0.4.29"
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2.3.5"
window-vibrancy = "0.6"
dirs = "6.0.0"
arboard = "3.6.1"
base64 = "0.22.1"
image = "0.25.8"
imageproc = "0.25.0"
ab_glyph = "0.2.29"
fontdb = "0.16.2"
xcap = "0.9.1"
drag = "2.1.0"
file_icon_provider = "1.0.0"
notify = "8.2.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = "3.6.2"
rand = "0.8"
sha2 = "0.10"
tar = "0.4.45"
flate2 = "1.1.5"
bzip2 = "0.6.1"
xz2 = "0.1.7"
zip = "8.5.1"
sevenz-rust = { version = "0.6.1", default-features = false }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-recursion = "1"
overlay-contracts = { path = "../crates/overlay-contracts" }
yazi-specta = { path = "../crates/yazi-specta" }
yazi-boot = { path = "../crates/fileexplorer/crates/yazi-boot" }
yazi-config = { path = "../crates/fileexplorer/crates/yazi-config" }
yazi-dds = { path = "../crates/fileexplorer/crates/yazi-dds" }
yazi-fs = { path = "../crates/fileexplorer/crates/yazi-fs" }
yazi-scheduler = { path = "../crates/fileexplorer/crates/yazi-scheduler" }
yazi-shared = { path = "../crates/fileexplorer/crates/yazi-shared" }
yazi-term = { path = "../crates/fileexplorer/crates/yazi-term" }
yazi-vfs = { path = "../crates/fileexplorer/crates/yazi-vfs" }
arc-swap = "1.7.1"
cpal = "0.17.3"
rubato = "2.0.0"
rustfft = "6.4.1"
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }

[dev-dependencies]
tokio  = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-windows = { path = "../crates/file-opening-windows" }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
file-opening = { path = "../crates/file-opening" }
file-opening-macos = { path = "../crates/file-opening-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
