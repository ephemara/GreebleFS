version = 1
id = "preview-terminal-ping"
name = "Preview Terminal Ping"
description = "Route a shell-based smoke test into the preview terminal lane."
icon = "TerminalSquare"
tags = ["smoke", "preview-terminal", "shell"]
contexts = ["entry", "background", "multi-select", "search-result", "preview-pane"]
appliesTo = "any"

[selection]
allowFiles = true
allowDirectories = true

[execution]
runner = "shell"
entry = '''printf 'Preview terminal smoke test\n'; printf 'Working directory: %s\n' "$PWD"; printf 'Action root: %s\n' "${GREEBLEFS_ACTION_ROOT:-<none>}"; printf 'Primary path: %s\n' "${GREEBLEFS_PRIMARY_PATH:-<none>}"; printf 'Selected count: %s\n' "${GREEBLEFS_SELECTED_COUNT:-0}"; printf '\nContext payload preview:\n'; if [ -n "${GREEBLEFS_ACTION_CONTEXT_FILE:-}" ] && [ -f "${GREEBLEFS_ACTION_CONTEXT_FILE}" ]; then sed -n '1,20p' "${GREEBLEFS_ACTION_CONTEXT_FILE}"; else printf '<no context file found>\n'; fi'''

[presentation]
outputTarget = "preview-terminal"
