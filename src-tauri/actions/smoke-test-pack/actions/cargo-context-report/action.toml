version = 1
id = "cargo-context-report"
name = "Cargo Context Report"
description = "Run a tiny Rust action so you can verify the Cargo runner and payload handoff."
icon = "Boxes"
tags = ["smoke", "cargo", "rust"]
contexts = ["entry", "background", "multi-select", "search-result", "preview-pane"]
appliesTo = "any"

[selection]
allowFiles = true
allowDirectories = true

[execution]
runner = "cargo"
entry = "cargo-context-report/Cargo.toml"

[presentation]
outputTarget = "task-center"
