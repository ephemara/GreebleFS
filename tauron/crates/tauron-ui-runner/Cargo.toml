[package]
name = "tauron-ui-runner"
version = "0.1.0"
description = "Lightweight scriptable Wry/WebView UI runner for Tauron frontend proofs"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "tauron-ui-runner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.35.0", default-features = false, features = ["rwh_06"] }
wry = { version = "0.55.0", default-features = false, features = [
  "os-webview",
  "protocol",
  "devtools",
] }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
wry = { version = "0.55.0", default-features = false, features = [
  "os-webview",
  "protocol",
  "devtools",
  "linux-body",
  "x11",
] }
