[package]
name = "tauri-plugin-kain"
version = "0.1.0"
description = "Kain bridge plugin for Tauron applications"
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/tauri-apps/tauri"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-kain"

[lib]
name = "tauri_plugin_kain"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.0", path = "../tauri" }

[build-dependencies]
tauri-plugin = { version = "2.6.0", path = "../tauri-plugin", features = [
  "build",
] }
