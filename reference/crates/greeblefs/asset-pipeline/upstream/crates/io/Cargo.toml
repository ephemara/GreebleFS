[package]
name = "k-os-io"
version = "0.1.0"
edition = "2021"
description = "K_OS IO domain crate - ownership boundary for storage and import/export workflows"

[lib]
name = "k_os_io"
path = "src/lib.rs"

[dependencies]
k-os-material = { path = "../material" }
tauri = { version = "2", features = [] }
dirs = "6"
log = "0.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
bincode = "1.3"
async-trait = "0.1"
rocksdb = "0.22"
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
num_cpus = "1.16"
rayon = "1.10"
ahash = "0.8"
gltf = { version = "1.4", features = ["utils"] }
gltf-json = "1.4"
tobj = "4.0"
image = "0.25"
uuid = { workspace = true, features = ["v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

