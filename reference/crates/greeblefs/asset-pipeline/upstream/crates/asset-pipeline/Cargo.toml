[package]
name = "k-os-asset-pipeline"
version = "0.1.0"
edition = "2021"
description = "K_OS Asset Pipeline - Unified asset import/export/processing with format detection, caching, and extensible trait-based architecture"

[lib]
name = "k_os_asset_pipeline"
path = "src/lib.rs"

[dependencies]
# === ERROR HANDLING ===
thiserror = "2.0"
anyhow = "1.0"

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# === FILE HASHING ===
blake3 = "1.5"

# === IMAGE PROCESSING ===
image = { version = "0.25", features = ["png", "jpeg", "tiff", "webp"] }

# === 3D FORMAT SUPPORT ===
gltf = { version = "1.4", features = ["utils"] }
tobj = "4.0"  # OBJ format

# === MULTI-FORMAT SUPPORT (optional) ===
# Consider assimp-rs for FBX, USD, Alembic support
# assimp-rs = { version = "0.3", optional = true }

# === CONCURRENCY ===
parking_lot = "0.12"
rayon = "1.10"

# === LOGGING ===
log = "0.4"

# === PATH HANDLING ===
walkdir = "2.5"

[dev-dependencies]
# === TESTING ===
proptest = "1.5"
env_logger = "0.11"
tempfile = "3.13"

[features]
default = []
# assimp = ["assimp-rs"]  # Enable for FBX, USD, Alembic support
