[package]
name = "greeblefs-shell-patterns-bundle"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Curated bevydcc shell and UI pattern bundle prepared for GreebleFS adoption."

[lib]
path = "src/lib.rs"

[package.metadata.greeblefs-curation]
bundle = "shell-patterns"
focus = "host routing, panel composition, diagnostics, and explorer-adjacent shell patterns"
lift_priority = "medium"
upstream_crates = ["ui", "bevy"]
highlight_files = [
  "crates/ui/src/panels.rs",
  "crates/ui/src/surfaces.rs",
  "crates/ui/src/asset_browser.rs",
  "crates/bevy/src/host/router.rs",
]
