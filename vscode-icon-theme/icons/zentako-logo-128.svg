<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Futuristic gradient -->
    <linearGradient id="zentakoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <radialGradient id="zentakoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filter for glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle glow -->
  <circle cx="64" cy="64" r="60" fill="url(#zentakoGlow)" opacity="0.1"/>
  
  <!-- 3D Wireframe Z (main letter) -->
  <!-- Top horizontal -->
  <path d="M30 35 L98 35 L94 40 L34 40 Z" fill="url(#zentakoGrad)" filter="url(#glow)"/>
  
  <!-- Diagonal slash (3D effect with depth) -->
  <path d="M94 40 L34 88 L30 93 L90 45 Z" fill="url(#zentakoGrad)" opacity="0.9"/>
  
  <!-- Bottom horizontal -->
  <path d="M34 88 L30 93 L98 93 L94 88 Z" fill="url(#zentakoGrad)" filter="url(#glow)"/>
  
  <!-- 3D depth lines (wireframe effect) -->
  <line x1="30" y1="35" x2="34" y2="40" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  <line x1="98" y1="35" x2="94" y2="40" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="93" x2="34" y2="88" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  <line x1="98" y1="93" x2="94" y2="88" stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Orbital rings (representing 3D space) -->
  <ellipse cx="64" cy="64" rx="55" ry="20" stroke="#06B6D4" stroke-width="1.5" fill="none" opacity="0.4" transform="rotate(30 64 64)"/>
  <ellipse cx="64" cy="64" rx="55" ry="20" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.3" transform="rotate(-30 64 64)"/>
  
  <!-- Corner nodes (3D vertices) -->
  <circle cx="30" cy="35" r="3" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="98" cy="35" r="3" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="30" cy="93" r="3" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="98" cy="93" r="3" fill="#8B5CF6" filter="url(#glow)"/>
  
  <!-- Center energy core -->
  <circle cx="64" cy="64" r="4" fill="url(#zentakoGrad)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="2" fill="white" opacity="0.8"/>
</svg>