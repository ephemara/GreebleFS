[package]
name = "k-os-ui"
version = "0.1.0"
description = "Shared editor UI systems and egui tooling for the K-OS workspace"
edition = "2021"

[dependencies]
base64 = "0.22"
bevy = { version = "0.17", default-features = true }
bevy_egui = "0.38"
egui_dock = "0.18"
egui-file-dialog = "0.12"
egui-notify = "0.21"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
