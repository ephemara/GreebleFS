[package]
name = "greeblefs-asset-pipeline-bundle"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Curated bevydcc asset and indexing bundle prepared for GreebleFS adoption."

[lib]
path = "src/lib.rs"

[package.metadata.greeblefs-curation]
bundle = "asset-pipeline"
focus = "metadata-first processing, content-hash caching, registry-driven import policy, and indexing"
lift_priority = "high"
upstream_crates = ["asset-pipeline", "io", "plugin", "workspace-registry"]
highlight_files = [
  "crates/asset-pipeline/src/cache.rs",
  "crates/asset-pipeline/src/pipeline.rs",
  "crates/asset-pipeline/src/processors/thumbnail_processor.rs",
  "crates/workspace-registry/src/lib.rs",
]
