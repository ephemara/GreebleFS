[package]
name = "k-os-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
lazy_static = "1.4"
k-os-brushes = { path = "../brushes" }
k-os-gpu-pipeline = { path = "../gpu-pipeline" }
k-os-mesh = { path = "../mesh" }
k-os-sculpt = { path = "../sculpt" }
wgpu = "26"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
nalgebra = "0.33"
