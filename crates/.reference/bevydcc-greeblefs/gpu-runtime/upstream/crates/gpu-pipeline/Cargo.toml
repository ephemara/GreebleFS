[package]
name = "k-os-gpu-pipeline"
version = "0.1.0"
edition = "2021"
description = "K_OS GPU Pipeline Manager - Centralized GPU compute pipeline management with caching, buffer pooling, and performance monitoring"

[lib]
name = "k_os_gpu_pipeline"
path = "src/lib.rs"

[features]
default = []
tauri-commands = ["dep:tauri"]

[dependencies]
# === GPU COMPUTE (WGPU) ===
wgpu = "26"
pollster = "0.4.0"

# === CORE UTILITIES ===
thiserror = "2.0"
log = "0.4"

# === CONCURRENCY ===
parking_lot = "0.12"
once_cell = "1.21"

# === FILE WATCHING (for hot-reloading) ===
notify = "7.0"

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.20", features = ["derive"] }
k-os-eval = { path = "../eval" }
k-os-kain = { path = "../kain" }
k-os-scene = { path = "../scene" }
naga = { version = "26", features = ["spv-in", "wgsl-out"] }
base64 = "0.22"
glam = { version = "0.30", features = ["serde", "bytemuck"] }
image = "0.25"
lazy_static = "1.4"
noise = "0.9"
rand = "0.8"
rayon = "1.10"
fastrand = "2.0"
tauri = { version = "2", optional = true }

# === COLLECTIONS ===
hashbrown = "0.15"

[dev-dependencies]
# === TESTING ===
proptest = "1.5"
env_logger = "0.11"
tempfile = "3.13"
serial_test = "3.2"
