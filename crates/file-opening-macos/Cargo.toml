[package]
name = "file-opening-macos"
version = "0.1.0"
edition = "2021"

[dependencies]
file-opening = { path = "../file-opening" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = { version = "1.0", features = ["serde"] }

[build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }
