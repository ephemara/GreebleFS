version = 1
id = "line-ending-inspector"
name = "Line Ending Inspector"
description = "Detects line endings (LF, CRLF, CR) in text files."
icon = "FileText"
tags = ["line-endings", "text", "compatibility", "crlf", "lf"]
contexts = ["entry"]
appliesTo = "file"

[selection]
minCount = 1
maxCount = 50
allowFiles = true
allowDirectories = false

[execution]
runner = "interpreter"
entry = "python/line_ending_inspector.py"

[presentation]
outputTarget = "task-center"
