version = 1
id = "detect-encoding"
name = "Detect Encoding"
description = "Detects file encoding (UTF-8, ASCII, Latin-1, etc.) for text files."
icon = "FileType"
tags = ["encoding", "text", "compatibility"]
contexts = ["entry", "multi-select"]
appliesTo = "any"

[selection]
minCount = 1
allowFiles = true
allowDirectories = true

[execution]
runner = "interpreter"
entry = "python/detect_encoding.py"

[presentation]
outputTarget = "task-center"
