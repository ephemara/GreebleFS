version = 1
id = "archive-integrity-check"
name = "Archive Integrity Check"
description = "Tests archive integrity without extracting files."
icon = "FileZip"
tags = ["archive", "integrity", "validation"]
contexts = ["entry"]
appliesTo = "file"

[selection]
minCount = 1
maxCount = 1
allowFiles = true
allowDirectories = false

[execution]
runner = "shell"
entry = '''
#!/bin/bash
set -euo pipefail

archive_path="${GREEBLEFS_PRIMARY_PATH:-}"

if [ -z "$archive_path" ]; then
    echo "Error: No archive file specified"
    exit 1
fi

if [ ! -f "$archive_path" ]; then
    echo "Error: File not found: $archive_path"
    exit 1
fi

filename=$(basename "$archive_path")
extension="${filename##*.}"

echo "Archive Integrity Check"
echo "======================="
echo "File: $filename"
echo "Path: $archive_path"
echo ""

test_result=0

case "${extension,,}" in
    zip)
        if command -v unzip >/dev/null 2>&1; then
            echo "Testing ZIP archive integrity..."
            echo ""
            if unzip -t "$archive_path" 2>&1; then
                echo ""
                echo "✓ Archive integrity: PASSED"
                echo "The archive is valid and can be extracted safely."
            else
                test_result=$?
                echo ""
                echo "✗ Archive integrity: FAILED"
                echo "The archive may be corrupted or incomplete."
            fi
        else
            echo "Error: unzip command not found"
            exit 1
        fi
        ;;
    tar)
        echo "Testing TAR archive integrity..."
        echo ""
        if tar -tf "$archive_path" >/dev/null 2>&1; then
            echo "✓ Archive integrity: PASSED"
            echo "The archive is valid and can be extracted safely."
        else
            test_result=$?
            echo "✗ Archive integrity: FAILED"
            echo "The archive may be corrupted or incomplete."
        fi
        ;;
    gz|tgz)
        if [[ "$filename" == *.tar.gz ]] || [[ "$filename" == *.tgz ]]; then
            echo "Testing TAR.GZ archive integrity..."
            echo ""
            if tar -tzf "$archive_path" >/dev/null 2>&1; then
                echo "✓ Archive integrity: PASSED"
                echo "The archive is valid and can be extracted safely."
            else
                test_result=$?
                echo "✗ Archive integrity: FAILED"
                echo "The archive may be corrupted or incomplete."
            fi
        else
            echo "Testing GZIP file integrity..."
            echo ""
            if gzip -t "$archive_path" 2>&1; then
                echo ""
                echo "✓ Archive integrity: PASSED"
                echo "The compressed file is valid."
            else
                test_result=$?
                echo ""
                echo "✗ Archive integrity: FAILED"
                echo "The compressed file may be corrupted."
            fi
        fi
        ;;
    bz2|tbz2)
        if [[ "$filename" == *.tar.bz2 ]] || [[ "$filename" == *.tbz2 ]]; then
            echo "Testing TAR.BZ2 archive integrity..."
            echo ""
            if tar -tjf "$archive_path" >/dev/null 2>&1; then
                echo "✓ Archive integrity: PASSED"
                echo "The archive is valid and can be extracted safely."
            else
                test_result=$?
                echo "✗ Archive integrity: FAILED"
                echo "The archive may be corrupted or incomplete."
            fi
        else
            echo "Testing BZIP2 file integrity..."
            echo ""
            if bzip2 -t "$archive_path" 2>&1; then
                echo ""
                echo "✓ Archive integrity: PASSED"
                echo "The compressed file is valid."
            else
                test_result=$?
                echo ""
                echo "✗ Archive integrity: FAILED"
                echo "The compressed file may be corrupted."
            fi
        fi
        ;;
    7z)
        if command -v 7z >/dev/null 2>&1; then
            echo "Testing 7Z archive integrity..."
            echo ""
            if 7z t "$archive_path" 2>&1; then
                echo ""
                echo "✓ Archive integrity: PASSED"
                echo "The archive is valid and can be extracted safely."
            else
                test_result=$?
                echo ""
                echo "✗ Archive integrity: FAILED"
                echo "The archive may be corrupted or incomplete."
            fi
        else
            echo "Error: 7z command not found"
            exit 1
        fi
        ;;
    rar)
        if command -v unrar >/dev/null 2>&1; then
            echo "Testing RAR archive integrity..."
            echo ""
            if unrar t "$archive_path" 2>&1; then
                echo ""
                echo "✓ Archive integrity: PASSED"
                echo "The archive is valid and can be extracted safely."
            else
                test_result=$?
                echo ""
                echo "✗ Archive integrity: FAILED"
                echo "The archive may be corrupted or incomplete."
            fi
        else
            echo "Error: unrar command not found"
            exit 1
        fi
        ;;
    *)
        echo "Error: Unsupported archive format: .$extension"
        echo "Supported formats: zip, tar, tar.gz, tgz, tar.bz2, tbz2, 7z, rar"
        exit 1
        ;;
esac

exit $test_result
'''

[presentation]
outputTarget = "task-center"
