version = 1
id = "inspect-archive"
name = "Inspect Archive"
description = "Lists contents of archive files without extracting them."
icon = "Archive"
tags = ["archive", "inspection", "listing"]
contexts = ["entry"]
appliesTo = "file"

[selection]
minCount = 1
maxCount = 1
allowFiles = true
allowDirectories = false

[execution]
runner = "shell"
entry = '''
#!/bin/bash
set -euo pipefail

archive_path="${GREEBLEFS_PRIMARY_PATH:-}"

if [ -z "$archive_path" ]; then
    echo "Error: No archive file specified"
    exit 1
fi

if [ ! -f "$archive_path" ]; then
    echo "Error: File not found: $archive_path"
    exit 1
fi

filename=$(basename "$archive_path")
extension="${filename##*.}"

echo "Archive Inspector"
echo "================="
echo "File: $filename"
echo "Path: $archive_path"
echo ""

case "${extension,,}" in
    zip)
        if command -v unzip >/dev/null 2>&1; then
            echo "Archive contents (ZIP):"
            echo ""
            unzip -l "$archive_path"
        else
            echo "Error: unzip command not found"
            exit 1
        fi
        ;;
    tar)
        echo "Archive contents (TAR):"
        echo ""
        tar -tvf "$archive_path"
        ;;
    gz|tgz)
        if [[ "$filename" == *.tar.gz ]] || [[ "$filename" == *.tgz ]]; then
            echo "Archive contents (TAR.GZ):"
            echo ""
            tar -tzvf "$archive_path"
        else
            echo "Archive contents (GZIP):"
            echo ""
            gzip -l "$archive_path"
        fi
        ;;
    bz2|tbz2)
        if [[ "$filename" == *.tar.bz2 ]] || [[ "$filename" == *.tbz2 ]]; then
            echo "Archive contents (TAR.BZ2):"
            echo ""
            tar -tjvf "$archive_path"
        else
            echo "Error: Plain bzip2 files don't support listing"
            exit 1
        fi
        ;;
    7z)
        if command -v 7z >/dev/null 2>&1; then
            echo "Archive contents (7Z):"
            echo ""
            7z l "$archive_path"
        else
            echo "Error: 7z command not found"
            exit 1
        fi
        ;;
    rar)
        if command -v unrar >/dev/null 2>&1; then
            echo "Archive contents (RAR):"
            echo ""
            unrar l "$archive_path"
        else
            echo "Error: unrar command not found"
            exit 1
        fi
        ;;
    *)
        echo "Error: Unsupported archive format: .$extension"
        echo "Supported formats: zip, tar, tar.gz, tgz, tar.bz2, tbz2, 7z, rar"
        exit 1
        ;;
esac
'''

[presentation]
outputTarget = "task-center"
