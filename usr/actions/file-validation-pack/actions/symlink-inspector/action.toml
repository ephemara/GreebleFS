version = 1
id = "symlink-inspector"
name = "Symlink Inspector"
description = "Detects and reports symlinks and their targets, including broken links."
icon = "Link"
tags = ["validation", "symlinks", "filesystem"]
contexts = ["entry"]
appliesTo = "any"

[selection]
allowFiles = true
allowDirectories = true

[execution]
runner = "shell"
entry = '''#!/bin/bash
echo "=== Symlink Inspector ==="
echo "Scanning: ${GREEBLEFS_CURRENT_LOCATION:-$PWD}"
echo ""

symlink_count=0
broken_count=0

# Check if primary path is a symlink
if [ -n "$GREEBLEFS_PRIMARY_PATH" ] && [ -L "$GREEBLEFS_PRIMARY_PATH" ]; then
    echo "Selected entry is a symlink:"
    echo "  Source: $GREEBLEFS_PRIMARY_PATH"
    target=$(readlink "$GREEBLEFS_PRIMARY_PATH")
    echo "  Target: $target"
    
    if [ -e "$GREEBLEFS_PRIMARY_PATH" ]; then
        echo "  Status: ✓ Valid (target exists)"
        
        # Show target type
        if [ -d "$GREEBLEFS_PRIMARY_PATH" ]; then
            echo "  Target type: Directory"
        elif [ -f "$GREEBLEFS_PRIMARY_PATH" ]; then
            echo "  Target type: File"
        fi
    else
        echo "  Status: ✗ BROKEN (target does not exist)"
    fi
    echo ""
fi

# Find all symlinks in current location
echo "All symlinks in current directory:"
echo ""

find "${GREEBLEFS_CURRENT_LOCATION:-$PWD}" -maxdepth 3 -type l 2>/dev/null | while read -r link; do
    symlink_count=$((symlink_count + 1))
    target=$(readlink "$link")
    
    echo "[$symlink_count] $(basename "$link")"
    echo "    Path: $link"
    echo "    Target: $target"
    
    if [ -e "$link" ]; then
        echo "    Status: ✓ Valid"
        
        # Resolve to absolute path
        if command -v realpath >/dev/null 2>&1; then
            resolved=$(realpath "$link" 2>/dev/null)
            if [ -n "$resolved" ]; then
                echo "    Resolved: $resolved"
            fi
        fi
    else
        echo "    Status: ✗ BROKEN"
        broken_count=$((broken_count + 1))
    fi
    echo ""
done

# Summary
total=$(find "${GREEBLEFS_CURRENT_LOCATION:-$PWD}" -maxdepth 3 -type l 2>/dev/null | wc -l)
echo "=" * 40
echo "Summary:"
echo "  Total symlinks found: $total"

if [ "$total" -eq 0 ]; then
    echo "  No symlinks found in current directory"
fi
'''

[presentation]
outputTarget = "task-center"
