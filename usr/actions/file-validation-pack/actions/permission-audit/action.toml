version = 1
id = "permission-audit"
name = "Permission Audit"
description = "Reports detailed permission info for selected entries including owner, group, and mode."
icon = "Shield"
tags = ["validation", "permissions", "security"]
contexts = ["entry", "multi-select"]
appliesTo = "any"

[selection]
minCount = 1
allowFiles = true
allowDirectories = true

[execution]
runner = "shell"
entry = '''#!/bin/bash
echo "=== Permission Audit ==="
echo "Selected count: ${GREEBLEFS_SELECTED_COUNT:-0}"
echo ""

# Read the context file if available
if [ -n "$GREEBLEFS_ACTION_CONTEXT_FILE" ] && [ -f "$GREEBLEFS_ACTION_CONTEXT_FILE" ]; then
    # Parse JSON to get selected entries
    # For simplicity, we'll use the primary path if available
    if [ -n "$GREEBLEFS_PRIMARY_PATH" ]; then
        echo "Analyzing: $GREEBLEFS_PRIMARY_PATH"
        echo ""
        
        if [ -e "$GREEBLEFS_PRIMARY_PATH" ]; then
            # Detailed permissions
            ls -lhd "$GREEBLEFS_PRIMARY_PATH"
            echo ""
            
            # Numeric permissions
            stat -c "Permissions: %a (octal)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null || \
            stat -f "Permissions: %Lp (octal)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null
            
            # Owner and group
            stat -c "Owner: %U (UID: %u)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null || \
            stat -f "Owner: %Su (UID: %u)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null
            
            stat -c "Group: %G (GID: %g)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null || \
            stat -f "Group: %Sg (GID: %g)" "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null
            
            # File type
            if [ -L "$GREEBLEFS_PRIMARY_PATH" ]; then
                echo "Type: Symbolic link"
            elif [ -d "$GREEBLEFS_PRIMARY_PATH" ]; then
                echo "Type: Directory"
            elif [ -f "$GREEBLEFS_PRIMARY_PATH" ]; then
                echo "Type: Regular file"
            else
                echo "Type: Special file"
            fi
            
            # Check if readable/writable/executable
            echo ""
            echo "Access checks:"
            [ -r "$GREEBLEFS_PRIMARY_PATH" ] && echo "  ✓ Readable" || echo "  ✗ Not readable"
            [ -w "$GREEBLEFS_PRIMARY_PATH" ] && echo "  ✓ Writable" || echo "  ✗ Not writable"
            [ -x "$GREEBLEFS_PRIMARY_PATH" ] && echo "  ✓ Executable" || echo "  ✗ Not executable"
            
            # Try to get ACLs if available
            echo ""
            if command -v getfacl >/dev/null 2>&1; then
                echo "Extended ACLs:"
                getfacl "$GREEBLEFS_PRIMARY_PATH" 2>/dev/null || echo "  No extended ACLs"
            fi
        else
            echo "ERROR: Path does not exist"
        fi
    else
        echo "No primary path available"
    fi
else
    echo "No context file available"
fi
'''

[presentation]
outputTarget = "task-center"
