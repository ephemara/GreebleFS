version = 1
id = "report-current-folder"
name = "Report Current Folder"
description = "Use the shell runner to echo the current folder and injected action environment."
icon = "FolderSearch"
tags = ["smoke", "background", "shell"]
contexts = ["background"]
appliesTo = "any"

[selection]
allowFiles = true
allowDirectories = true

[execution]
runner = "shell"
entry = '''printf 'GreebleFS shell smoke test\nPWD: %s\nCurrent location: %s\nSelected count: %s\nPrimary path: %s\nContext file: %s\n' "$PWD" "${GREEBLEFS_CURRENT_LOCATION:-<none>}" "${GREEBLEFS_SELECTED_COUNT:-0}" "${GREEBLEFS_PRIMARY_PATH:-<none>}" "${GREEBLEFS_ACTION_CONTEXT_FILE:-<none>}"'''

[presentation]
outputTarget = "task-center"
