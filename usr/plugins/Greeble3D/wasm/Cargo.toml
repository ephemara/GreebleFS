[package]
name = "k-greeble-wasm"
version = "0.1.0"
edition = "2021"
description = "K-Greeble WASM module for web preview - compiled binary protects implementation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
noise = "0.9.0"

# Your secret sauce (compiled into opaque WASM)
# Uncomment when ready to link:
# k-os-engine = { path = "../../k_os_hybrid/crates/k-os-engine", default-features = false }

[profile.release]
# Maximum protection + performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true  # Remove debug symbols

[package.metadata.wasm-pack.profile.release]
wasm-opt = false  # Prefer reproducible portable builds over toolchain-sensitive post-optimization

[workspace]
