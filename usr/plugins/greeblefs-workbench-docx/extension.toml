id = "greeblefs-workbench-docx"
version = "1"
name = "GreebleFS Document Workbench"
description = "First-party extension-backed word-processing document preview workbench."
entry = "index.tsx"
defaultOpen = false
keepMounted = false
category = "First-party Workbenches"
tags = ["first-party", "workbench", "preview", "document", "office"]

[[testFiles]]
id = "docx-brief"
label = "Document Brief Fixture"
path = "examples/document-brief.docx"
description = "Small generated DOCX fixture for plugin-panel preview smoke tests."

[[contributions.previewLanes]]
id = "docx"
title = "Document Workbench"
renderer = "preview/docxWorkbench.tsx"
priority = 720

[contributions.previewLanes.match]
appliesTo = "file"
extensions = ["docx", "doc", "rtf", "odt"]
fileNames = []
previewKinds = ["docx"]

[contributions.previewLanes.workbenchChrome]
includePreviewTab = true
includeEditTab = false
topBarDensity = "compact"

[contributions.previewLanes.capabilities]
editable = false
save = false
export = false
workflowTabs = false
contextMenu = false
prefetch = false
closeGuard = false
