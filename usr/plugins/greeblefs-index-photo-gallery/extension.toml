id = "greeblefs-index-photo-gallery"
version = "1"
name = "Index Photo Gallery"
description = "First-party gallery plugin backed by the global filename index."
entry = "index.tsx"
defaultOpen = false
keepMounted = true
category = "First-party Media"
tags = ["first-party", "index", "gallery", "photos", "media"]

[permissions]
fsRead = true
launchIntents = ["open-explorer"]

[[contributions.settingsSlots]]
id = "gallery-settings"
title = "Gallery Settings"
description = "Control which indexed folders and picture extensions the gallery uses on desktop and mobile."
iconName = "SlidersHorizontal"
keywords = ["gallery", "photos", "index", "mobile", "folders", "extensions"]
order = 42

[contributions.settingsSlots.defaults]
rootPaths = ""
fileExtensions = "jpg, jpeg, png, gif, webp, svg, bmp, ico, avif, tiff, tif"
resultLimit = 240
includeHidden = false

[[contributions.settingsSlots.fields]]
id = "rootPaths"
label = "Folder Paths"
description = "Optional absolute desktop paths or mobile-share-relative paths. Leave empty to use the active index scope."
kind = "path-list"
placeholder = "C:\\Users\\Admin\\Pictures"
defaultValue = ""

[[contributions.settingsSlots.fields]]
id = "fileExtensions"
label = "File Types"
description = "Enable the built-in gallery image types, then add custom extensions at the end."
kind = "extension-list"
placeholder = "raw, heic, exr"
defaultValue = "jpg, jpeg, png, gif, webp, svg, bmp, ico, avif, tiff, tif"

[[contributions.settingsSlots.fields.options]]
value = "jpg"
label = "JPG"
description = "JPEG photo files."

[[contributions.settingsSlots.fields.options]]
value = "jpeg"
label = "JPEG"
description = "Long-form JPEG extension."

[[contributions.settingsSlots.fields.options]]
value = "png"
label = "PNG"
description = "Portable Network Graphics."

[[contributions.settingsSlots.fields.options]]
value = "gif"
label = "GIF"
description = "Animated or indexed-color GIF images."

[[contributions.settingsSlots.fields.options]]
value = "webp"
label = "WebP"
description = "Modern web image files."

[[contributions.settingsSlots.fields.options]]
value = "svg"
label = "SVG"
description = "Vector image assets."

[[contributions.settingsSlots.fields.options]]
value = "bmp"
label = "BMP"
description = "Bitmap image files."

[[contributions.settingsSlots.fields.options]]
value = "ico"
label = "ICO"
description = "Icon image files."

[[contributions.settingsSlots.fields.options]]
value = "avif"
label = "AVIF"
description = "AV1 image files."

[[contributions.settingsSlots.fields.options]]
value = "tiff"
label = "TIFF"
description = "Tagged image files."

[[contributions.settingsSlots.fields.options]]
value = "tif"
label = "TIF"
description = "Short-form TIFF extension."

[[contributions.settingsSlots.fields]]
id = "resultLimit"
label = "Result Limit"
description = "Maximum indexed pictures to request per refresh."
kind = "number"
defaultValue = 240
min = 24
max = 500
step = 24

[[contributions.settingsSlots.fields]]
id = "includeHidden"
label = "Include Hidden Files"
description = "Include hidden files and folders when querying the index."
kind = "boolean"
defaultValue = false

[[contributions.mobilePanes]]
id = "photo-gallery"
title = "Photo Gallery"
description = "Browse indexed pictures from the paired mobile shell using the same plugin package."
iconName = "Images"
order = 42
category = "First-party Media"
kind = "viewer"
renderer = "mobile/gallery.js"
styles = ["mobile/gallery.css"]

[contributions.mobilePanes.theme]
accent = "var(--mobile-accent)"

[contributions.mobilePanes.theme.cssVars]
"--mobile-plugin-accent" = "var(--mobile-accent)"
