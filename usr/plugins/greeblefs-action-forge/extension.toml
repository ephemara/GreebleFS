id = "greeblefs-action-forge"
version = "1"
name = "Action Forge"
description = "First-party panel for authoring GreebleFS explorer action packs directly into usr/actions."
entry = "index.tsx"
defaultOpen = false
keepMounted = true
category = "First-party Automation"
tags = ["first-party", "actions", "automation", "authoring"]

[permissions]
fsRead = true
fsWrite = true
launchIntents = ["open-explorer"]

[[dependencies]]
id = "greeblefs-ui"
version = "^1.0.0"
importAs = "@greeblefs/ui"
required = true

[[dependencies]]
id = "greeblefs-plugin-tools"
version = "^1.0.0"
importAs = "@greeblefs/plugin-tools"
required = true
