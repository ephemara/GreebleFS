id = "greeblefs-workbench-audio"
version = "1"
name = "GreebleFS Audio Workbench"
description = "First-party extension-backed audio preview and edit workbench."
entry = "index.tsx"
defaultOpen = false
keepMounted = false
category = "First-party Workbenches"
tags = ["first-party", "workbench", "preview", "audio", "media"]

[[testFiles]]
id = "audio-tone"
label = "Audio Tone Fixture"
path = "examples/audio-tone.wav"
description = "Tiny generated WAV fixture for plugin-panel preview smoke tests."

[[contributions.previewLanes]]
id = "audio"
title = "Audio Workbench"
renderer = "preview/audioWorkbench.tsx"
priority = 720

[contributions.previewLanes.match]
appliesTo = "file"
extensions = ["aac", "aif", "aiff", "aifc", "alac", "amr", "caf", "flac", "m4a", "m4b", "mid", "midi", "mka", "mp3", "oga", "ogg", "opus", "wav", "wave", "weba", "wma"]
fileNames = []

[contributions.previewLanes.workbenchChrome]
includePreviewTab = true
includeEditTab = true
topBarDensity = "compact"

[[contributions.previewLanes.workbenchChrome.wildcardTabs]]
id = "vst"
label = "VST"
baseMode = "edit"

[contributions.previewLanes.capabilities]
editable = true
save = false
export = true
workflowTabs = true
contextMenu = false
prefetch = false
closeGuard = false
