id = "test-extension-hello"
version = "1"
name = "Test Extension Hello"
description = "Smoke-test extension package that claims .test files through the preview lane registry."
entry = "index.tsx"
defaultOpen = false
keepMounted = false

[[contributions.previewLanes]]
id = "hello-test-preview"
title = "Hello .test Preview"
renderer = "preview/helloTestPreview.tsx"
priority = 950

[contributions.previewLanes.match]
appliesTo = "file"
extensions = ["test"]
fileNames = []

[contributions.previewLanes.capabilities]
editable = false
save = false
export = false
workflowTabs = false
contextMenu = false
prefetch = false
closeGuard = false

[[contributions.mobilePanes]]
id = "hello-mobile"
title = "Hello Mobile"
description = "A mobile-safe pane contributed from the same usr/plugins package root as the desktop plugin."
iconName = "Puzzle"
order = 40
category = "Smoke Tests"
kind = "dashboard"

[contributions.mobilePanes.theme]
accent = "var(--mobile-accent)"

[contributions.mobilePanes.theme.cssVars]
"--mobile-plugin-accent" = "var(--mobile-accent)"

[[contributions.mobilePanes.sections]]
id = "root-access"
title = "Shared Plugin Root"
body = "This pane is discovered from usr/plugins/test-extension-hello and can expose package assets through the desktop host."
assetPath = "examples/hello-world.test"

[[contributions.mobilePanes.actions]]
id = "copy-current-path"
label = "Copy Path"
description = "Copies the current mobile share path so backend actions can receive the same context."
iconName = "Copy"
kind = "copy"
tone = "accent"
copyText = "{currentPath}"
