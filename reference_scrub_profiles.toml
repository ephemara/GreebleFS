[profiles.dolphin]
keep_roots = ["LICENSES", "cmake", "src"]
drop_roots = ["appiumtests", "doc", "po", "completions"]
hoist_roots = ["src"]
drop_paths = ["src/tests"]

[profiles.fexplorer]
keep_roots = ["src", "src-tauri"]
drop_roots = [".github", ".vscode", "public", "screenshots"]
hoist_roots = ["src"]
collapse_roots = ["src-tauri"]

[profiles.files-main]
keep_roots = ["src"]
drop_roots = [".github", "tests"]
hoist_roots = ["src"]

[profiles.sigma]
keep_roots = ["src", "src-shared", "src-tauri", "packages"]
drop_roots = [".github", ".vscode", "e2e-webdriver", "public", "scripts", "snap"]
hoist_roots = ["src"]
collapse_roots = ["src-tauri"]

[profiles.sigma.root_aliases]
"packages/api" = "api"

[profiles.spacedrive]
keep_roots = ["adapters", "apps", "core", "crates", "extensions", "packages", "scripts", "xtask"]
drop_roots = [".cargo", ".cspell", ".github", ".tasks", ".vscode", ".zed", "whitepaper"]
hoist_roots = ["adapters", "apps", "crates", "extensions", "packages"]

[profiles.vscode]
keep_roots = ["build", "cli", "extensions", "remote", "resources", "scripts", "src"]
hoist_roots = ["build", "extensions", "remote", "resources", "scripts", "src"]
collapse_roots = ["cli"]

[profiles.xplorer]
keep_roots = ["apps", "infra", "packages", "scripts"]
drop_roots = [".github", ".husky", ".vscode", "images"]
hoist_roots = ["apps", "packages"]

[profiles.zed]
keep_roots = ["crates", "extensions", "script", "tooling"]
drop_roots = [".github", ".zed", ".cloudflare", ".config", ".factory", "assets", "ci", "docs", "legal", "nix"]
hoist_roots = ["crates", "extensions", "script", "tooling"]
