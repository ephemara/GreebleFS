[global]
repomap_filename = "repomap.md"
manifest_filename = "reference-scrub-manifest.json"
staging_dir_suffix = ".reference-scrub-staging"
backup_dir_suffix = ".reference-scrub-backup"
collapse_container_names = ["src", "Sources", "lib"]
generic_hoist_root_names = [
  "src",
  "apps",
  "packages",
  "crates",
  "extensions",
  "modules",
  "plugins",
  "projects",
  "adapters",
]
drop_dir_names = [
