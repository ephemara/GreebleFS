version = 1
id = "dry-run-rename"
name = "Dry-Run Rename"
description = "Simulates batch rename operations without actually renaming files. Preview rename patterns safely."
icon = "FileEdit"
tags = ["batch", "rename", "dry-run", "edge-cases"]
contexts = ["multi-select"]
appliesTo = "any"

[selection]
minCount = 2
allowFiles = true
allowDirectories = true

[execution]
runner = "interpreter"
entry = "python/dry_run_rename.py"

[presentation]
outputTarget = "task-center"
