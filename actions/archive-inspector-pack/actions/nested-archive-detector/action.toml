version = 1
id = "nested-archive-detector"
name = "Nested Archive Detector"
description = "Detects archives within archives by analyzing file listings."
icon = "Package"
tags = ["archive", "nested", "detection"]
contexts = ["entry"]
appliesTo = "file"

[selection]
minCount = 1
maxCount = 1
allowFiles = true
allowDirectories = false

[execution]
runner = "interpreter"
entry = "python/nested_archive_detector.py"

[presentation]
outputTarget = "task-center"
