version = 1
id = "check-large-files"
name = "Check Large Files"
description = "Identifies files over 100MB in the current directory and reports their sizes."
icon = "FileWarning"
tags = ["validation", "size", "performance"]
contexts = ["entry"]
appliesTo = "any"

[selection]
allowFiles = true
allowDirectories = true

[execution]
runner = "shell"
entry = '''#!/bin/bash
echo "=== Large File Check ==="
echo "Scanning: ${GREEBLEFS_CURRENT_LOCATION:-$PWD}"
echo "Threshold: 100MB"
echo ""

# Find files larger than 100MB
find "${GREEBLEFS_CURRENT_LOCATION:-$PWD}" -type f -size +100M 2>/dev/null | while read -r file; do
    size=$(du -h "$file" | cut -f1)
    echo "LARGE: $size - $file"
done

# Count total large files
count=$(find "${GREEBLEFS_CURRENT_LOCATION:-$PWD}" -type f -size +100M 2>/dev/null | wc -l)
echo ""
echo "Total files over 100MB: $count"
'''

[presentation]
outputTarget = "task-center"
